name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 🪜 Setup pnpm
        uses: pnpm/action-setup@v6

      - name: 🖥️ Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: 🏗️ Install deps
        run: pnpm install

      - name: 📦 Build Package
        run: pnpm run build

      - name: 🚀 Publish Package
        run: npm publish --access public --no-git-checks --provenance
